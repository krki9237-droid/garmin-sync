name: Garmin Connect Sync

on:
  schedule:
    # every 30 minutes
    - cron: "*/30 * * * *"  # Runs at 21:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Garmin data
        env:
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
        run: python garmin_sync.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/garmin_data.json
          if git diff --cached --quiet; then
            echo "No changes in garmin_data.json"
          else
            git commit -m "Garmin sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
